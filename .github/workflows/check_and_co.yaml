---
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
permissions: {}
name: All actions
jobs:
  check-current-version:
    name: Check current version
    permissions:
      contents: read
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/check_current_version.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
    with:
      use_local_setup_action: true
  pkgdown:
    name: Pkgdown site
    permissions:
      contents: write
      pull-requests: write
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/pkgdown.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
    with:
      use_local_setup_action: true
  coverage:
    name: Coverage report
    permissions:
      contents: read
      pull-requests: write
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/coverage.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      use_local_setup_action: true
      use_codecov: true
  megalinter:
    name: Megalinter
    permissions:
      contents: read
      pull-requests: write
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/megalinter.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
